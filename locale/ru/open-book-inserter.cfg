[mod-name]
OpenBookInserter=Перенос в открытую книгу

[mod-description]
OpenBookInserter=Нажмите Shift, чтобы переместить чертёж или книгу из руки в открытую книгу чертежей. Клавишу можно изменить в настройках управления → Моды.

[controls]
obi-insert=Переместить чертёж/книгу из руки в открытую книгу

[obi]
invalid-target=Сначала откройте книгу чертежей из инвентаря.
library-cursor=В руке ссылка на библиотеку чертежей. Сначала поместите копию в инвентарь и возьмите этот предмет.
empty-hand=Сначала возьмите в руку чертёж или книгу чертежей.
unsupported-item=Этой клавишей можно переносить только чертежи и книги чертежей.
recursive-book=Нельзя поместить книгу внутрь самой себя или одной из вложенных в неё книг.
book-full=В целевой книге нет свободных ячеек.
transfer-failed=Игра отклонила перенос. Предмет в руке не удалён.
