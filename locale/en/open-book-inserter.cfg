[mod-name]
OpenBookInserter=Open Book Inserter

[mod-description]
OpenBookInserter=Press Shift to move the blueprint or blueprint book in your hand into the currently open blueprint book. The key can be changed in Controls → Mods.

[controls]
obi-insert=Move held blueprint/book into the open book

[obi]
invalid-target=Open a blueprint book from your inventory first.
library-cursor=This is a blueprint-library reference. Put a copy in your inventory and pick up that item first.
empty-hand=Pick up a blueprint or a blueprint book first.
unsupported-item=Only blueprints and blueprint books can be moved with this shortcut.
recursive-book=A book cannot be placed inside itself or one of its nested books.
book-full=The target book has no empty slots.
transfer-failed=The game rejected the transfer. The held item has not been removed.
